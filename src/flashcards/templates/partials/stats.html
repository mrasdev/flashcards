<article id="stats">
  <header><strong>Statistics</strong></header>
  <div class="overflow-auto">
    <table>
      <thead>
        <tr>
          {% for box in stats.boxes %}
          <th scope="col">Box {{ box }}</th>
          {% endfor %}
          <th scope="col">Total</th>
          <th scope="col">Due today</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          {% for box, count in stats.boxes.items() %}
          <td data-box="{{ box }}">{{ count }}</td>
          {% endfor %}
          <td data-stat="total">{{ stats.total }}</td>
          <td data-stat="due-today"><strong>{{ stats.due_today }}</strong></td>
        </tr>
      </tbody>
    </table>
  </div>
  <a href="/decks/{{ deck.id }}/study" role="button">
    {% if stats.due_today %}Study ({{ stats.due_today }} due){% else %}Study{% endif %}
  </a>
</article>
