<tr id="deck-{{ deck.id }}">
  <td><a href="/decks/{{ deck.id }}">{{ deck.name }}</a></td>
  <td data-stat="due-today">{{ due_counts.get(deck.id, 0) }}</td>
  <td class="actions">
    <button type="button" class="secondary outline"
            hx-get="/decks/{{ deck.id }}/edit" hx-target="closest tr" hx-swap="outerHTML">
      Rename
    </button>
    <button type="button" class="contrast outline"
            hx-delete="/decks/{{ deck.id }}" hx-target="#decks" hx-swap="outerHTML"
            hx-confirm="Delete deck “{{ deck.name }}” and all its cards?">
      Delete
    </button>
  </td>
</tr>
