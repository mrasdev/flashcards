<section id="decks">
  <form class="inline-form" method="post" action="/decks"
        hx-post="/decks" hx-target="#decks" hx-swap="outerHTML">
    <input type="text" name="name" value="{{ name }}" placeholder="Name of the new deck"
           aria-label="Name of the new deck" required
           {% if error %}aria-invalid="true"{% endif %}>
    <button type="submit">Add deck</button>
  </form>
  {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}

  {% if decks %}
  <table>
    <thead>
      <tr>
        <th scope="col">Deck</th>
        <th scope="col">Due today</th>
        <th scope="col"><span class="visually-hidden">Actions</span></th>
      </tr>
    </thead>
    <tbody>
      {% for deck in decks %}
      {% include "partials/deck_row.html" %}
      {% endfor %}
    </tbody>
  </table>
  {% else %}
  <p>No decks yet. Add your first deck above.</p>
  {% endif %}
</section>
