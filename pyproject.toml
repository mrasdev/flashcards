[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lernkartei"
version = "0.1.0"
description = "Karteikarten-Trainer mit Leitner-System als Webapp"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "sqlmodel",
    "jinja2",
    "uvicorn",
    "python-multipart",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "httpx",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lernkartei = ["templates/**/*", "static/**/*"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
